name: Package skills & update README

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/package-and-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-and-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Build skill zips
        id: build
        run: bash scripts/build-skills.sh

      - name: Update README skills table
        run: python scripts/update-readme-table.py

      - name: Commit README if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-update skills table [skip ci]"
            git push
          else
            echo "README already up to date."
          fi

      - name: Publish release
        if: hashFiles('dist/*.zip') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills-${{ github.run_number }}
          name: Skills release ${{ github.run_number }}
          body: |
            Automated build of all skills on ${{ github.sha }}.

            Download a skill: `https://github.com/${{ github.repository }}/releases/latest/download/<skill-name>.zip`
          files: dist/*.zip
          make_latest: true
