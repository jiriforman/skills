name: cetin-design-template
display_name: CETIN Design (Template)
description: CETIN corporate design system, template-driven — for PowerPoint it edits the bundled official CETIN template (CETIN_sablona_prezentace_Final.pptx) directly, reusing its ready-made slide layouts (cover, dividers, KPI cards, tables, roadmaps/Gantt, process steps, org charts, mind maps) 1:1 instead of redrawing them, and generates new slides only for text-heavy content the template can't cover. Also brands HTML/React, Excel, and Word. Pick this OR the text-heavy "CETIN Design" skill — installing both will conflict.
